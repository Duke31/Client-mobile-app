name: emergency_request
description: Patient emergency request app. Mapbox raster tiles via flutter_map; reverse geocoding via Mapbox; backend via Supabase.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  http: ^1.2.2
  geolocator: ^13.0.2
  supabase_flutter: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
