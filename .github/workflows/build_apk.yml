name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Project Source
        run: |
          if [ -d emergency_request ]; then
            cp -R emergency_request/. .
          elif ls *.zip > /dev/null 2>&1; then
            unzip -o *.zip
            if [ -d emergency_request ]; then cp -R emergency_request/. .; fi
          fi

      - name: Fix submitted screen
        run: |
          # Remove stale interactive:false lines (original fix)
          sed -i '/interactive: false,/d' emergency_request/lib/screens/submitted_screen.dart || true
          sed -i '/interactive: false,/d' lib/screens/submitted_screen.dart || true

          # Targets the LiveAmbulanceTrackingScreen(...) call block in submitted_screen.dart
          for f in emergency_request/lib/screens/submitted_screen.dart lib/screens/submitted_screen.dart; do
            [ -f "$f" ] || continue
            sed -i '/patientLatitude:/d' "$f"
            sed -i '/patientLongitude:/d' "$f"
            if grep -q 'patientLocation:' "$f"; then
              echo "patientLocation already present in $f"
            else
              sed -i '/requestId: id,/a\          patientLocation: (widget.latitude != null \&\& widget.longitude != null) ? LatLng(widget.latitude!, widget.longitude!) : const LatLng(0, 0),' "$f"
            fi
            sed -i 's/\$vehicleLabel)/\$_vehicleLabel)/g' "$f"
            sed -i "s/\$vehicleLabel'/\$_vehicleLabel'/g" "$f"
          done

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Inject Environment Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          jq -n \
            --arg url "$SUPABASE_URL" \
            --arg key "$SUPABASE_ANON_KEY" \
            --arg token "$MAPBOX_ACCESS_TOKEN" \
            '{SUPABASE_URL:$url,SUPABASE_ANON_KEY:$key,MAPBOX_ACCESS_TOKEN:$token}' \
            > config.json

      - name: Install Dependencies
        run: flutter pub get

      - name: Ensure Android platform
        run: flutter create --platforms=android --project-name emergency_request --org com.example .

      - name: Apply Solace Launcher Branding
        run: |
          if [ -d assets/launcher ]; then
            cp -R assets/launcher/* android/app/src/main/res/ || true
          fi
          if [ -d emergency_request/assets ]; then
            mkdir -p assets
            cp -R emergency_request/assets/* assets/ || true
          fi

      - name: Add location permissions and intent queries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          if "ACCESS_FINE_LOCATION" not in text:
              insert = (
                  "\n    <uses-permission android:name=\"android.permission.INTERNET\" />"
                  "\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />"
                  "\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />"
                  "\n    <uses-permission android:name=\"android.permission.CALL_PHONE\" />"
              )
              i = text.find(">")
              text = text[: i + 1] + insert + text[i + 1 :]
          text = text.replace('android:label="emergency_request"', 'android:label="Solace EMS"')
          if "<queries>" not in text:
              q = (
                  "\n    <queries>"
                  "\n        <intent>"
                  "\n            <action android:name=\"android.intent.action.DIAL\" />"
                  "\n            <data android:scheme=\"tel\" />"
                  "\n        </intent>"
                  "\n        <intent>"
                  "\n            <action android:name=\"android.intent.action.VIEW\" />"
                  "\n            <data android:scheme=\"tel\" />"
                  "\n        </intent>"
                  "\n        <intent>"
                  "\n            <action android:name=\"android.intent.action.CALL\" />"
                  "\n            <data android:scheme=\"tel\" />"
                  "\n        </intent>"
                  "\n        <intent>"
                  "\n            <action android:name=\"android.intent.action.SENDTO\" />"
                  "\n            <data android:scheme=\"sms\" />"
                  "\n        </intent>"
                  "\n        <intent>"
                  "\n            <action android:name=\"android.intent.action.VIEW\" />"
                  "\n            <data android:scheme=\"https\" />"
                  "\n        </intent>"
                  "\n    </queries>"
              )
              end_tag = text.rfind("</manifest>")
              if end_tag != -1:
                  text = text[:end_tag] + q + "\n" + text[end_tag:]
          p.write_text(text)
          PY

      - name: Build Release APK
        run: flutter build apk --release --target-platform=android-arm,android-arm64 --dart-define-from-file=config.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solace-client-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Push APK to Supabase Storage
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -n "$SUPABASE_URL" ]; then
            echo "Uploading release APK directly to Supabase storage app-releases bucket via TUS..."
            APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
            if [ ! -f "$APK_PATH" ]; then
              echo "Error: $APK_PATH not found"
              exit 1
            fi

            FILE_SIZE=$(wc -c < "$APK_PATH" | tr -d ' ')
            echo "APK file size: $FILE_SIZE bytes"

            CLEAN_URL="${SUPABASE_URL%/}"
            PROJECT_REF=$(echo "$CLEAN_URL" | sed -E 's|https?://([^.]+)\..*|\1|')
            TUS_ENDPOINT="https://${PROJECT_REF}.storage.supabase.co/storage/v1/upload/resumable"
            echo "TUS Endpoint: $TUS_ENDPOINT"

            # Delete old objects if exist to prevent 409 conflict
            DEL_PAYLOAD='{"prefixes":["solace-v1.0.apk","solace-client.apk"]}'
            curl -s -X DELETE "${CLEAN_URL}/storage/v1/object/app-releases" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -d "$DEL_PAYLOAD" || true

            for OBJ_NAME in "solace-v1.0.apk" "solace-client.apk"; do
              echo "Uploading $OBJ_NAME..."
              B64_BUCKET=$(echo -n "app-releases" | base64 | tr -d '\n')
              B64_OBJECT=$(echo -n "$OBJ_NAME" | base64 | tr -d '\n')
              B64_MIME=$(echo -n "application/vnd.android.package-archive" | base64 | tr -d '\n')

              INIT_RESP=$(curl -s -i -X POST "$TUS_ENDPOINT" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "Tus-Resumable: 1.0.0" \
                -H "Upload-Length: $FILE_SIZE" \
                -H "Upload-Metadata: bucketName $B64_BUCKET,objectName $B64_OBJECT,contentType $B64_MIME" \
                -H "x-upsert: true")

              LOCATION=$(echo "$INIT_RESP" | grep -i '^location:' | awk '{print $2}' | tr -d '\r\n')
              if [ -z "$LOCATION" ]; then
                echo "Failed to initialize TUS for $OBJ_NAME. Header output:"
                echo "$INIT_RESP"
                continue
              fi

              PATCH_HTTP=$(curl -s -w "%{http_code}" -o /tmp/tus_res.txt -X PATCH "$LOCATION" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "Tus-Resumable: 1.0.0" \
                -H "Upload-Offset: 0" \
                -H "Content-Type: application/offset+octet-stream" \
                --data-binary "@$APK_PATH")

              echo "TUS PATCH $OBJ_NAME result: HTTP $PATCH_HTTP"
              if [ "$PATCH_HTTP" -eq 204 ] || [ "$PATCH_HTTP" -eq 200 ]; then
                echo "SUCCESS: $OBJ_NAME deployed to Supabase Storage."
              else
                echo "WARNING: Failed to upload $OBJ_NAME (HTTP $PATCH_HTTP)"
                cat /tmp/tus_res.txt || true
              fi
            done
          else
            echo "Notice: SUPABASE_SERVICE_ROLE_KEY or SUPABASE_URL secret not set. Skipping direct storage push."
          fi
