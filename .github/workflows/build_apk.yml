name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack Project Zip
        run: |
          if ls *.zip >/dev/null 2>&1; then unzip -o *.zip; fi
          if [ -d emergency_request ]; then cp -R emergency_request/. .; fi

      - name: Fix submitted screen
        run: |
          sed -i '/interactive: false,/d' emergency_request/lib/screens/submitted_screen.dart || true
          sed -i '/interactive: false,/d' lib/screens/submitted_screen.dart || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Inject Environment Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          jq -n \
            --arg url "$SUPABASE_URL" \
            --arg key "$SUPABASE_ANON_KEY" \
            --arg token "$MAPBOX_ACCESS_TOKEN" \
            '{SUPABASE_URL:$url,SUPABASE_ANON_KEY:$key,MAPBOX_ACCESS_TOKEN:$token}' \
            > config.json

      - name: Install Dependencies
        run: flutter pub get

      - name: Ensure Android platform
        run: flutter create --platforms=android --project-name emergency_request --org com.example .

      - name: Add location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          if "ACCESS_FINE_LOCATION" not in text:
              insert = (
                  "\n    <uses-permission android:name=\"android.permission.INTERNET\" />"
                  "\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />"
                  "\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />"
              )
              i = text.find(">")
              text = text[: i + 1] + insert + text[i + 1 :]
              p.write_text(text)
          PY

      - name: Build Release APK
        run: flutter build apk --release --dart-define-from-file=config.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solace-client-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14