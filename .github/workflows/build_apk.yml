name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack Project Zip
        run: |
          if ls *.zip >/dev/null 2>&1; then
            unzip -o *.zip
          fi
          if [ -d emergency_request ]; then
            cp -R emergency_request/. .
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Inject Environment Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os

          def clean(name):
              v = os.environ.get(name, "").strip().replace("\r", "").replace("\n", "")
              if not v:
                  raise SystemExit(f"Missing secret: {name}")
              return v

          data = {
              "SUPABASE_URL": clean("SUPABASE_URL"),
              "SUPABASE_ANON_KEY": clean("SUPABASE_ANON_KEY"),
              "MAPBOX_ACCESS_TOKEN": clean("MAPBOX_ACCESS_TOKEN"),
          }
          open("config.json", "w", encoding="utf-
