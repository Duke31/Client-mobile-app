name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack Project Zip
        run: |
          if ls *.zip >/dev/null 2>&1; then unzip -o *.zip; fi
          if [ -d emergency_request ]; then cp -R emergency_request/. .; fi

      - name: Fix submitted screen
        run: |
          sed -i '/interactive: false,/d' emergency_request/lib/screens/submitted_screen.dart || true
          sed -i '/interactive: false,/d' lib/screens/submitted_screen.dart || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Inject Environment Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          jq -n \
            --arg url "$SUPABASE_URL" \
            --arg key "$SUPABASE_ANON_KEY" \
            --arg token "$MAPBOX_ACCESS_TOKEN" \
            '{SUPABASE_URL:$url,SUPABASE_ANON_KEY:$key,MAPBOX_ACCESS_TOKEN:$token}' \
            > config.json

      - name: Install Dependencies
        run: flutter pub get

      - name: Ensure Android platform
        run: flutter create --platforms=android --project-name emergency_request --org com.example .

      - name: Apply Solace Launcher Branding
        run: |
          if [ -d assets/launcher ]; then
            cp -R assets/launcher/* android/app/src/main/res/ || true
          fi
          if [ -d emergency_request/assets ]; then
            mkdir -p assets
            cp -R emergency_request/assets/* assets/ || true
          fi

      - name: Add location permissions and intent queries
        run: |
          python3 -c '
from pathlib import Path
p = Path("android/app/src/main/AndroidManifest.xml")
text = p.read_text()
if "ACCESS_FINE_LOCATION" not in text:
    perms = """
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
    <uses-permission android:name="android.permission.CALL_PHONE" />
"""
    i = text.find(">")
    text = text[:i+1] + perms + text[i+1:]
if "<queries>" not in text:
    q = """
    <queries>
        <intent>
            <action android:name="android.intent.action.DIAL" />
            <data android:scheme="tel" />
        </intent>
        <intent>
            <action android:name="android.intent.action.SENDTO" />
            <data android:scheme="sms" />
        </intent>
        <intent>
            <action android:name="android.intent.action.VIEW" />
            <data android:scheme="https" />
        </intent>
    </queries>
"""
    end_tag = text.rfind("</manifest>")
    if end_tag != -1:
        text = text[:end_tag] + q + text[end_tag:]
p.write_text(text)
print("Updated AndroidManifest.xml successfully!")
'

      - name: Build Release APK
        run: flutter build apk --release --dart-define-from-file=config.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solace-client-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
